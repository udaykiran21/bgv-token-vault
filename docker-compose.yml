version: "3.8"

services:
  blockchain:
    build: ./blockchain
    ports:
      - "8545:8545"
    volumes:
      - blockchain_artifacts:/app/artifacts

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - RPC_URL=http://blockchain:8545
      # We know the contract address because Hardhat deploys deterministically to the same address on the local node
      - CONTRACT_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3
      - PORT=5000
    volumes:
      - backend_uploads:/app/uploads
      - blockchain_artifacts:/app/blockchain/artifacts
    depends_on:
      - blockchain

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_uploads:
  blockchain_artifacts:
